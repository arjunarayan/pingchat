<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PingChat</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
</head>
<body>
  <!-- Sign-in screen -->
  <div id="auth-screen" class="overlay" hidden>
    <form id="auth-form" class="card">
      <h1>💬 PingChat</h1>
      <p>
        Enter your email and we'll send you a sign-in link. No password
        needed — and you'll stay signed in on every device.
      </p>
      <input
        id="email-input"
        type="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      />
      <button type="submit" id="auth-submit">Email me a sign-in link</button>
      <p id="auth-status" class="notice" hidden></p>
      <p id="auth-error" class="error-text" hidden></p>
    </form>
  </div>

  <!-- Display-name screen (shown once, on first sign-in) -->
  <div id="name-screen" class="overlay" hidden>
    <form id="name-form" class="card">
      <h1>Pick a display name</h1>
      <p>This is the name others will see next to your messages.</p>
      <input
        id="name-input"
        type="text"
        maxlength="40"
        placeholder="Your name"
        autocomplete="off"
        required
      />
      <button type="submit">Join chat</button>
    </form>
  </div>

  <!-- Chat screen -->
  <div id="chat-screen" hidden>
    <header class="chat-header">
      <div class="chat-title">
        <span class="logo">💬</span>
        <h1>PingChat</h1>
      </div>
      <div class="me">
        <span id="my-name"></span>
        <button id="change-name" class="ghost-btn" title="Change display name">✎</button>
        <button id="sign-out" class="ghost-btn">Sign out</button>
      </div>
    </header>

    <div id="error-banner" hidden></div>

    <main id="messages" aria-live="polite"></main>

    <div id="typing-indicator" hidden></div>

    <form id="composer">
      <input
        id="message-input"
        type="text"
        maxlength="1000"
        placeholder="Type a message…"
        autocomplete="off"
        required
      />
      <button type="submit" id="send-btn" aria-label="Send">➤</button>
    </form>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
